<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="買い時チェッカー">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>買い時チェッカー</title>
</head>
<body>
<header>
  <div><div class="eyebrow">PRICE HISTORY</div><h1>買い時チェッカー</h1></div>
  <button id="installHelp" class="header-btn">＋</button>
</header>

<main>
<section id="home" class="screen active">
  <div class="hero card">
    <div class="cart">🛒</div>
    <h2>今、この商品は買い時？</h2>
    <p>JANコードを読み取って、価格を記録しましょう。</p>
    <button id="scanBtn" class="primary large">📷 JANコードをスキャン</button>
    <button id="manualBtn" class="secondary">JANコードを入力</button>
  </div>
  <div class="stats">
    <div class="card stat"><b id="productCount">0</b><span>登録商品</span></div>
    <div class="card stat"><b id="recordCount">0</b><span>価格記録</span></div>
  </div>
  <div class="card">
    <h3>最近の価格記録</h3>
    <div id="recent">まだ記録がありません。</div>
  </div>
  <button id="dataBtn" class="link">商品・価格データを見る</button>
</section>

<section id="scanner" class="screen">
  <div class="top"><button class="back" data-back="home">‹ 戻る</button><h2>JANスキャン</h2></div>
  <div class="camera card">
    <video id="video" playsinline muted></video>
    <div class="scan-box"></div>
    <div id="scanMsg">カメラを起動しています…</div>
  </div>
  <button id="stopBtn" class="secondary">カメラを停止</button>
  <p class="hint">※ iPhoneのSafariではカメラ利用の許可が必要です。</p>
</section>

<section id="lookup" class="screen">
  <div class="top"><button class="back" data-back="home">‹ 戻る</button><h2>商品確認</h2></div>
  <div id="lookupBody"></div>
</section>

<section id="register" class="screen">
  <div class="top"><button class="back" data-back="lookup">‹ 戻る</button><h2>商品を登録</h2></div>
  <form id="productForm" class="card">
    <div class="jan">JAN：<b id="regJan"></b></div>
    <label>商品名 *</label><input id="pName" required placeholder="例：明治おいしい牛乳">
    <label>メーカー・ブランド</label><input id="pBrand" placeholder="例：明治">
    <label>容量・内容量</label><input id="pQty" placeholder="例：900ml">
    <label>商品写真</label>
    <div id="preview" class="preview hidden"><img id="previewImg"></div>
    <label class="photo">📷 商品写真を撮影 / 選択<input id="pImage" type="file" accept="image/*" capture="environment"></label>
    <button class="primary" type="submit">登録して価格を入力</button>
  </form>
</section>

<section id="price" class="screen">
  <div class="top"><button class="back" data-back="lookup">‹ 戻る</button><h2>価格を記録</h2></div>
  <div id="priceProduct" class="card"></div>
  <form id="priceForm" class="card">
    <label>店舗</label>
    <button type="button" id="storeBtn" class="store">📍 <span id="storeText">店舗を選択</span></button>
    <label>価格（税込・円） *</label><input id="priceInput" type="number" min="1" inputmode="numeric" required placeholder="198">
    <label>日付</label><input id="dateInput" type="date" required>
    <button class="primary" type="submit">価格を保存する</button>
  </form>
</section>

<section id="store" class="screen">
  <div class="top"><button class="back" data-back="price">‹ 戻る</button><h2>店舗を選択</h2></div>
  <div class="card">
    <p id="locMsg">現在地を取得しています…</p>
    <button id="nearbyBtn" class="secondary">📍 現在地を取得</button>
  </div>
  <div id="stores"></div>
  <div class="card">
    <label>見つからない場合</label><input id="storeManual" placeholder="例：○○スーパー 岡山店">
    <button id="useManual" class="primary">この店舗を使用</button>
  </div>
</section>

<section id="data" class="screen">
  <div class="top"><button class="back" data-back="home">‹ 戻る</button><h2>データ</h2></div>
  <div id="dataBody"></div>
  <div class="card"><button id="clearData" class="danger">すべて削除</button></div>
</section>
</main>

<div id="toast"></div>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script src="app.js"></script>
</body>
</html>
